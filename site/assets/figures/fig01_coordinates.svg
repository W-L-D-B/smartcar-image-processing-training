<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">01｜相机成像与两套坐标</title><desc id="desc">左图显示透视让画面采样间距随距离变化；右图标出图像 x 向右、y 向下。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">01｜相机成像与两套坐标</text>
<rect x="38" y="86" width="492" height="515" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="550" y="86" width="512" height="515" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="66" y="126" fill="#167D72" font-size="22" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">车体视角：地面距离不均匀</text><text x="580" y="126" fill="#167D72" font-size="22" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">图像坐标：行列是数组索引</text><path d="M100 520 L265 180 L435 520 Z" fill="#E1EEE7" stroke="#D6DFD9" stroke-width="2"/><line x1="265" y1="170" x2="265" y2="526" stroke="#4D79A5" stroke-width="3" stroke-dasharray="8 8"/><line x1="85" y1="485" x2="450" y2="485" stroke="#52696A" stroke-width="2"/><line x1="112" y1="400" x2="420" y2="400" stroke="#52696A" stroke-width="2"/><line x1="150" y1="310" x2="380" y2="310" stroke="#52696A" stroke-width="2"/><line x1="204" y1="230" x2="328" y2="230" stroke="#52696A" stroke-width="2"/><text x="93" y="556" fill="#52696A" font-size="16" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">近处采样间距较小</text><text x="315" y="556" fill="#52696A" font-size="16" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">同一行不是固定米数</text><rect x="242" y="155" width="46" height="24" rx="7" fill="#183235" stroke="none" stroke-width="1"/><circle cx="265" cy="168" r="6" fill="#ED7A3B" stroke="none" stroke-width="1"/><text x="265" y="147" fill="#52696A" font-size="16" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">相机</text><rect x="198" y="518" width="134" height="34" rx="12" fill="#DDE5DF" stroke="#D6DFD9" stroke-width="1"/><text x="265" y="541" fill="#183235" font-size="17" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">车体前方 ↑</text><rect x="612" y="164" width="388" height="330" rx="12" fill="#EAF0EC" stroke="#D6DFD9" stroke-width="2"/><line x1="660" y1="465" x2="962" y2="465" stroke="#183235" stroke-width="2"/><line x1="660" y1="465" x2="660" y2="200" stroke="#183235" stroke-width="2"/><path d="M665 420 C730 410 810 360 958 235" fill="none" stroke="#ED7A3B" stroke-width="10" stroke-linecap="round"/><line x1="690" y1="462" x2="928" y2="462" stroke="#167D72" stroke-width="3"/><line x1="690" y1="462" x2="690" y2="218" stroke="#167D72" stroke-width="3"/><text x="960" y="487" fill="#183235" font-size="16" font-weight="600" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">x 列 →</text><text x="680" y="212" fill="#183235" font-size="16" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">y 行 ↓</text><text x="810" y="517" fill="#52696A" font-size="16" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">数组索引可定位像素</text><text x="595" y="566" fill="#ED7A3B" font-size="17" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">行列坐标不是车体米制坐标</text>
</svg>