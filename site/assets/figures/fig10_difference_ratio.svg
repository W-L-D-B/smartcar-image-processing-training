<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">10｜差比和：让灰度跳变可比较</title><desc id="desc">在灰度矩阵中选择邻近点A和B，计算绝对差比和并将结果缩放到Q7。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">10｜差比和：让灰度跳变可比较</text>
<rect x="42" y="94" width="494" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="564" y="94" width="494" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="68" y="137" fill="#167D72" font-size="21" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">取一对相邻灰度样本</text><text x="590" y="137" fill="#167D72" font-size="21" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">把差异缩放到 Q7 范围</text><rect x="105" y="194" width="68" height="68" rx="0" fill="#2a2a2a" stroke="#BBCBC4" stroke-width="1"/><text x="139.0" y="236.16" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">42</text><rect x="173" y="194" width="68" height="68" rx="0" fill="#2c2c2c" stroke="#BBCBC4" stroke-width="1"/><text x="207.0" y="236.16" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">44</text><rect x="241" y="194" width="68" height="68" rx="0" fill="#2f2f2f" stroke="#BBCBC4" stroke-width="1"/><text x="275.0" y="236.16" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">47</text><rect x="309" y="194" width="68" height="68" rx="0" fill="#b4b4b4" stroke="#BBCBC4" stroke-width="1"/><text x="343.0" y="236.16" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">180</text><rect x="377" y="194" width="68" height="68" rx="0" fill="#c6c6c6" stroke="#BBCBC4" stroke-width="1"/><text x="411.0" y="236.16" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">198</text><rect x="105" y="262" width="68" height="68" rx="0" fill="#282828" stroke="#BBCBC4" stroke-width="1"/><text x="139.0" y="304.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">40</text><rect x="173" y="262" width="68" height="68" rx="0" fill="#2b2b2b" stroke="#BBCBC4" stroke-width="1"/><text x="207.0" y="304.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">43</text><rect x="241" y="262" width="68" height="68" rx="0" fill="#323232" stroke="#BBCBC4" stroke-width="1"/><text x="275.0" y="304.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">50</text><rect x="309" y="262" width="68" height="68" rx="0" fill="#bebebe" stroke="#BBCBC4" stroke-width="1"/><text x="343.0" y="304.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">190</text><rect x="377" y="262" width="68" height="68" rx="0" fill="#cdcdcd" stroke="#BBCBC4" stroke-width="1"/><text x="411.0" y="304.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">205</text><rect x="105" y="330" width="68" height="68" rx="0" fill="#262626" stroke="#BBCBC4" stroke-width="1"/><text x="139.0" y="372.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">38</text><rect x="173" y="330" width="68" height="68" rx="0" fill="#292929" stroke="#BBCBC4" stroke-width="1"/><text x="207.0" y="372.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">41</text><rect x="241" y="330" width="68" height="68" rx="0" fill="#343434" stroke="#BBCBC4" stroke-width="1"/><text x="275.0" y="372.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">52</text><rect x="309" y="330" width="68" height="68" rx="0" fill="#cacaca" stroke="#BBCBC4" stroke-width="1"/><text x="343.0" y="372.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">202</text><rect x="377" y="330" width="68" height="68" rx="0" fill="#d6d6d6" stroke="#BBCBC4" stroke-width="1"/><text x="411.0" y="372.15999999999997" fill="#183235" font-size="15" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">214</text><line x1="273" y1="216" x2="273" y2="380" stroke="#ED7A3B" stroke-width="3" stroke-dasharray="7 5"/><circle cx="273" cy="282" r="10" fill="#ED7A3B" stroke="none" stroke-width="1"/><text x="116" y="450" fill="#183235" font-size="18" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">A = 200</text><text x="320" y="450" fill="#183235" font-size="18" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">B = 40</text><text x="592" y="196" fill="#183235" font-size="21" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">R = |A-B| × 128 / (A+B+1)</text><text x="592" y="247" fill="#167D72" font-size="20" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">R = 160 × 128 / 241 ≈ 84</text><rect x="592" y="286" width="400" height="32" rx="12" fill="#E7ECE7" stroke="none" stroke-width="1"/><rect x="592" y="286" width="262" height="32" rx="12" fill="#ED7A3B" stroke="none" stroke-width="1"/><line x1="820" y1="274" x2="820" y2="337" stroke="#183235" stroke-width="2" stroke-dasharray="4 4"/><text x="592" y="355" fill="#52696A" font-size="16" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">小 R：两点相似；大 R：附近有强灰度跳变</text><text x="592" y="416" fill="#ED7A3B" font-size="16" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">分母加 1；A=B=0 时结果为 0</text><text x="592" y="465" fill="#52696A" font-size="15" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">方向版保留 A-B 的正负，绝对版只看跳变强度</text>
</svg>