<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">17｜C 灰度处理链与缓冲区预算</title><desc id="desc">灰度图依次进入阈值、扫线和IPM；底部给出一个80乘48示例的字节推导。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">17｜C 灰度处理链与缓冲区预算</text>
<rect x="42" y="94" width="1016" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="68" y="137" fill="#167D72" font-size="21" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">保留原始灰度帧；中间缓冲按算法生命周期复用</text><rect x="74" y="202" width="190" height="96" rx="12" fill="#E8EFEB" stroke="#167D72" stroke-width="2"/><text x="169" y="240" fill="#183235" font-size="18" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">GRAY8</text><text x="169" y="271" fill="#52696A" font-size="15" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">H×W</text><line x1="270" y1="250" x2="300" y2="250" stroke="#ED7A3B" stroke-width="3"/><rect x="310" y="202" width="190" height="96" rx="12" fill="#E8EFEB" stroke="#167D72" stroke-width="2"/><text x="405" y="240" fill="#183235" font-size="18" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">threshold</text><text x="405" y="271" fill="#52696A" font-size="15" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">T / mask</text><line x1="506" y1="250" x2="536" y2="250" stroke="#ED7A3B" stroke-width="3"/><rect x="546" y="202" width="190" height="96" rx="12" fill="#E8EFEB" stroke="#167D72" stroke-width="2"/><text x="641" y="240" fill="#183235" font-size="18" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">scan</text><text x="641" y="271" fill="#52696A" font-size="15" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">L[y], R[y]</text><line x1="742" y1="250" x2="772" y2="250" stroke="#ED7A3B" stroke-width="3"/><rect x="782" y="202" width="190" height="96" rx="12" fill="#FFF0E2" stroke="#ED7A3B" stroke-width="2"/><text x="877" y="240" fill="#183235" font-size="18" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">IPM</text><text x="877" y="271" fill="#52696A" font-size="15" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">lookup / warp</text><text x="78" y="368" fill="#4D79A5" font-size="16" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">Gray buffer</text><text x="254" y="368" fill="#183235" font-size="17" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">80×48 = 3,840 B</text><text x="78" y="408" fill="#167D72" font-size="16" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">1-bit mask</text><text x="254" y="408" fill="#183235" font-size="17" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">480 B packed; uint8 mask = 3,840 B</text><text x="78" y="448" fill="#ED7A3B" font-size="16" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">Sobel dx/dy</text><text x="254" y="448" fill="#183235" font-size="17" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">int16 buffer 2×H×W = 15,360 B</text><text x="78" y="513" fill="#52696A" font-size="15" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">画面尺寸/行跨度、DMA、标定表和栈另计；不等于板上可用 RAM。</text>
