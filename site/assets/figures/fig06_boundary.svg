<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">06｜逐行扫描和八邻域</title><desc id="desc">左边展示图像行上从中心向两侧找边；右边画中心周围八个邻点和按方向访问的顺序。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">06｜逐行扫描和八邻域</text>
<rect x="42" y="94" width="500" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="568" y="94" width="492" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="68" y="137" fill="#167D72" font-size="20" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">逐行扫描：简单、每行独立</text><text x="594" y="137" fill="#167D72" font-size="20" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">八邻域：带方向的跟踪</text><rect x="100" y="175" width="380" height="310" rx="8" fill="#EDF2EE" stroke="#D6DFD9" stroke-width="2"/><path d="M215 480 L240 180 M360 480 L335 180" stroke="#183235" stroke-width="10" fill="none"/><line x1="140" y1="390" x2="432" y2="390" stroke="#ED7A3B" stroke-width="4"/><line x1="280" y1="390" x2="220" y2="390" stroke="#4D79A5" stroke-width="3"/><line x1="280" y1="390" x2="365" y2="390" stroke="#4D79A5" stroke-width="3"/><circle cx="218" cy="390" r="7" fill="#D65B55" stroke="none" stroke-width="1"/><circle cx="367" cy="390" r="7" fill="#D65B55" stroke="none" stroke-width="1"/><text x="286" y="514" fill="#52696A" font-size="16" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">从中心沿行找左右跳变</text><rect x="753" y="277" width="63" height="63" rx="8" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="784.5" y="315.5" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">7 NW</text><rect x="816" y="277" width="63" height="63" rx="8" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="847.5" y="315.5" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">0 N</text><rect x="879" y="277" width="63" height="63" rx="8" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="910.5" y="315.5" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">1 NE</text><rect x="753" y="340" width="63" height="63" rx="8" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="784.5" y="378.5" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">6 W</text><rect x="816" y="340" width="63" height="63" rx="8" fill="#E7EFE9" stroke="#D6DFD9" stroke-width="2"/><text x="847.5" y="378.5" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">C</text><rect x="879" y="340" width="63" height="63" rx="8" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="910.5" y="378.5" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">2 E</text><rect x="753" y="403" width="63" height="63" rx="8" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="784.5" y="441.5" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">5 SW</text><rect x="816" y="403" width="63" height="63" rx="8" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="847.5" y="441.5" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">4 S</text><rect x="879" y="403" width="63" height="63" rx="8" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="910.5" y="441.5" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">3 SE</text><path d="M818 340 L816 276 L880 276 L880 340 L880 402 L816 402" fill="none" stroke="#ED7A3B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#ED7A3B"/></marker></defs><text x="814" y="514" fill="#52696A" font-size="15" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">重复状态 (像素+方向) / 步数上限</text><text x="77" y="548" fill="#ED7A3B" font-size="15" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">不会自动处理岔路；第一跳变可能是噪点。</text>
</svg>