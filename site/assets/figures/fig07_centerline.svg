y2="230" stroke="#52696A" stroke-width="2" stroke-dasharray="6 6"/><circle cx="428" cy="230" r="6" fill="#4D79A5" stroke="none" stroke-width="1"/><circle cx="663" cy="230" r="6" fill="#ED7A3B" stroke="none" stroke-width="1"/><circle cx="545" cy="230" r="9" fill="#167D72" stroke="#FFFFFF" stroke-width="2"/><path d="M545 487 C548 400 543 320 550 230" fill="none" stroke="#167D72" stroke-width="4" stroke-dasharray="8 8"/><text x="550" y="548" fill="#52696A" font-size="16" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">图像中的中线坐标；要另标定到地面距离</text><text x="245" y="510" fill="#4D79A5" font-size="15" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">左边界</text><text x="865" y="510" fill="#ED7A3B" font-size="15" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">右边界</text><text x="565" y="275" fill="#183235" font-size="16" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">远处更窄：透视</text>
