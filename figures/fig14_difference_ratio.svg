<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">14｜差比和把局部灰度跳变缩放到定点数</title><desc id="desc">四组灰度邻点对照差比和结果；包括平滑区、高反差和分母为零边界。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">14｜差比和把局部灰度跳变缩放到定点数</text>
<rect x="52" y="94" width="995" height="487" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="84" y="142" fill="#183235" font-size="24" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">D(a,b) = |a-b| × 128 / (a+b+1)</text><text x="90" y="225" fill="#52696A" font-size="17" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">a=200, b= 40</text><rect x="290" y="205" width="580" height="34" rx="10" fill="#E2E8E3" stroke="none" stroke-width="1"/><rect x="290" y="205" width="380.625" height="34" rx="10" fill="#167D72" stroke="none" stroke-width="1"/><text x="900" y="228" fill="#ED7A3B" font-size="17" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">D=84</text><text x="90" y="303" fill="#52696A" font-size="17" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">a=120, b=100</text><rect x="290" y="283" width="580" height="34" rx="10" fill="#E2E8E3" stroke="none" stroke-width="1"/><rect x="290" y="283" width="54.375" height="34" rx="10" fill="#167D72" stroke="none" stroke-width="1"/><text x="900" y="306" fill="#ED7A3B" font-size="17" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">D=12</text><text x="90" y="381" fill="#52696A" font-size="17" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">a= 62, b= 60</text><rect x="290" y="361" width="580" height="34" rx="10" fill="#E2E8E3" stroke="none" stroke-width="1"/><rect x="290" y="361" width="9.0625" height="34" rx="10" fill="#167D72" stroke="none" stroke-width="1"/><text x="900" y="384" fill="#ED7A3B" font-size="17" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">D=2</text><text x="90" y="459" fill="#52696A" font-size="17" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">a=255, b=  0</text><rect x="290" y="439" width="580" height="34" rx="10" fill="#E2E8E3" stroke="none" stroke-width="1"/><rect x="290" y="439" width="575.46875" height="34" rx="10" fill="#167D72" stroke="none" stroke-width="1"/><text x="900" y="462" fill="#ED7A3B" font-size="17" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">D=127</text><text x="90" y="535" fill="#183235" font-size="17" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">单位范围近似 0..128；数值越大，越像灰度边界。</text><text x="90" y="567" fill="#52696A" font-size="15" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">a=b=0 的分母要防零；只取绝对值会丢失边缘方向。</text>
</svg>