<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">14｜八邻域的方向记忆、回溯与停机</title><desc id="desc">九宫格按方向编号；访问状态包括当前坐标和进入方向，避免环路无限运行。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">14｜八邻域的方向记忆、回溯与停机</text>
<rect x="42" y="94" width="1016" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="68" y="137" fill="#167D72" font-size="21" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">位置 + 进入方向才是可检测循环的完整状态</text><rect x="293" y="258" width="82" height="82" rx="7" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="334.0" y="305.0" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">7 NW</text><rect x="375" y="258" width="82" height="82" rx="7" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="416.0" y="305.0" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">0 N</text><rect x="457" y="258" width="82" height="82" rx="7" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="498.0" y="305.0" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">1 NE</text><rect x="293" y="340" width="82" height="82" rx="7" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="334.0" y="387.0" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">6 W</text><rect x="375" y="340" width="82" height="82" rx="7" fill="#F1F4F0" stroke="#D6DFD9" stroke-width="2"/><text x="416.0" y="387.0" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">S</text><rect x="457" y="340" width="82" height="82" rx="7" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="498.0" y="387.0" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">2 E</text><rect x="293" y="422" width="82" height="82" rx="7" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="334.0" y="469.0" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">5 SW</text><rect x="375" y="422" width="82" height="82" rx="7" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="416.0" y="469.0" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">4 S</text><rect x="457" y="422" width="82" height="82" rx="7" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="2"/><text x="498.0" y="469.0" fill="#183235" font-size="15" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">3 SE</text><path d="M375 258 L457 258 L457 340 L457 422 L375 422 L293 422" fill="none" stroke="#ED7A3B" stroke-width="4" marker-end="url(#arrow2)"/><defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ED7A3B"/></marker></defs><text x="710" y="218" fill="#167D72" font-size="18" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">每步检查 8 个邻点</text><text x="710" y="255" fill="#183235" font-size="16" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">存 (x, y, dir)，不是只存坐标</text><text x="710" y="318" fill="#183235" font-size="16" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">无邻点：终止或回溯</text><text x="710" y="356" fill="#ED7A3B" font-size="16" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">重复状态 / 超过 H×W 步：停机</text><text x="710" y="418" fill="#52696A" font-size="15" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">岔口：按固定优先方向选，不可随机跳</text><text x="710" y="488" fill="#52696A" font-size="14" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">二值连通较差时，灰度边缘法会漏链；应先显示种子和visited。</text>
</svg>