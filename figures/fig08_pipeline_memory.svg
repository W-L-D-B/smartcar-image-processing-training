anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">中心线</text><line x1="803" y1="240" x2="822" y2="240" stroke="#ED7A3B" stroke-width="3"/><rect x="832" y="190" width="155" height="100" rx="14" fill="#FFF0E2" stroke="#ED7A3B" stroke-width="2"/><text x="909" y="231" fill="#183235" font-size="19" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">接口</text><text x="909" y="265" fill="#52696A" font-size="15" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">有效 + 置信度</text><text x="83" y="355" fill="#4D79A5" font-size="17" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">缓冲 A</text><rect x="170" y="330" width="320" height="54" rx="10" fill="#E5EDF5" stroke="#4D79A5" stroke-width="2"/><text x="330" y="364" fill="#183235" font-size="17" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">160×120×1 byte = 19,200 B</text><text x="83" y="433" fill="#4D79A5" font-size="17" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">缓冲 B</text><rect x="170" y="410" width="320" height="54" rx="10" fill="#DDF1E8" stroke="#167D72" stroke-width="2"/><text x="330" y="444" fill="#183235" font-size="17" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">二值 uint8 = 19,200 B</text><text x="560" y="355" fill="#167D72" font-size="17" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">流式实现</text><rect x="672" y="330" width="316" height="54" rx="10" fill="#E4EEE7" stroke="#D6DFD9" stroke-width="2"/><text x="830" y="364" fill="#183235" font-size="17" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">只保留必要行 / 状态</text><text x="560" y="433" fill="#ED7A3B" font-size="17" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">测量报告</text><rect x="672" y="410" width="316" height="54" rx="10" fill="#FFF0E2" stroke="#ED7A3B" stroke-width="2"/><text x="830" y="444" fill="#183235" font-size="17" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">芯片 + 输入 + 计时边界</text><text x="550" y="540" fill="#52696A" font-size="16" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">像素缓冲还要加 DMA 对齐、栈、映射表和其它模块用量</text>
