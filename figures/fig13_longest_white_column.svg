<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">13｜双最长白列：先确定从哪里扫</title><desc id="desc">近端白路面连续列长度作为视野统计，再从左右最长列出发搜赛道边界。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">13｜双最长白列：先确定从哪里扫</text>
<rect x="42" y="94" width="1016" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="68" y="137" fill="#167D72" font-size="20" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">先在近端向上数连续白像素，再把最长列作为扫描起点</text><rect x="112" y="185" width="420" height="300" rx="9" fill="#22292A" stroke="#D6DFD9" stroke-width="2"/><path d="M235 482 L286 188 L370 188 L426 482 Z" fill="#E9ECE8"/><line x1="135" y1="434" x2="509" y2="434" stroke="#9EAAA5" stroke-width="1" stroke-dasharray="4 5"/><line x1="135" y1="386" x2="509" y2="386" stroke="#9EAAA5" stroke-width="1" stroke-dasharray="4 5"/><line x1="135" y1="338" x2="509" y2="338" stroke="#9EAAA5" stroke-width="1" stroke-dasharray="4 5"/><line x1="135" y1="290" x2="509" y2="290" stroke="#9EAAA5" stroke-width="1" stroke-dasharray="4 5"/><line x1="135" y1="242" x2="509" y2="242" stroke="#9EAAA5" stroke-width="1" stroke-dasharray="4 5"/><line x1="268" y1="478" x2="268" y2="209" stroke="#ED7A3B" stroke-width="4" stroke-dasharray="7 5"/><line x1="397" y1="478" x2="397" y2="209" stroke="#4D79A5" stroke-width="4" stroke-dasharray="7 5"/><text x="267" y="515" fill="#ED7A3B" font-size="16" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">左最长白列</text><text x="397" y="515" fill="#4D79A5" font-size="16" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">右最长白列</text><rect x="604" y="191" width="398" height="96" rx="12" fill="#E8EFEA" stroke="#D6DFD9" stroke-width="1"/><text x="628" y="225" fill="#183235" font-size="18" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">逐列统计 count_white[x]</text><text x="628" y="258" fill="#52696A" font-size="16" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">从 y=H−1 向上，遇黑立即停止</text><rect x="604" y="312" width="398" height="96" rx="12" fill="#FFF0E2" stroke="#EDC59D" stroke-width="1"/><text x="628" y="346" fill="#ED7A3B" font-size="18" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">search_stop = max_len</text><text x="628" y="379" fill="#52696A" font-size="16" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">只在可见近端区间逐行搜边</text><text x="604" y="458" fill="#183235" font-size="16" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">输入：白路面二值图</text><text x="604" y="491" fill="#183235" font-size="16" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">输出：种子列、左右边界、丢边标志</text><text x="604" y="540" fill="#52696A" font-size="14" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">窄道/交叉/阴影会改变最长列，需限制 ROI 并验有效性。</text>
</svg>