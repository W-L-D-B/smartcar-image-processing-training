<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">15｜逆透视 IPM：像素坐标变换到俯视平面</title><desc id="desc">四个地面角点建立单应矩阵，将相机图像中的梯形道路映射到矩形鸟瞰图。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">15｜逆透视 IPM：像素坐标变换到俯视平面</text>
<rect x="42" y="94" width="1016" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="68" y="137" fill="#167D72" font-size="20" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">在地面平面上选四对角点：透视四边形 → 俯视矩形</text><rect x="96" y="180" width="385" height="302" rx="7" fill="#202728" stroke="#D6DFD9" stroke-width="2"/><path d="M222 470 L267 200 L305 200 L354 470 Z" fill="#F0F0EE"/><line x1="240.0" y1="230" x2="334.0" y2="230" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="241.05" y1="265" x2="332.95" y2="265" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="242.1" y1="300" x2="331.9" y2="300" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="243.15" y1="335" x2="330.85" y2="335" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="244.2" y1="370" x2="329.8" y2="370" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="245.25" y1="405" x2="328.75" y2="405" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="246.3" y1="440" x2="327.7" y2="440" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><circle cx="267" cy="200" r="7" fill="#ED7A3B" stroke="#FFFFFF" stroke-width="2"/><circle cx="305" cy="200" r="7" fill="#ED7A3B" stroke="#FFFFFF" stroke-width="2"/><circle cx="222" cy="470" r="7" fill="#ED7A3B" stroke="#FFFFFF" stroke-width="2"/><circle cx="354" cy="470" r="7" fill="#ED7A3B" stroke="#FFFFFF" stroke-width="2"/><line x1="500" y1="327" x2="578" y2="327" stroke="#ED7A3B" stroke-width="4"/><rect x="604" y="180" width="385" height="302" rx="7" fill="#202728" stroke="#D6DFD9" stroke-width="2"/><path d="M694 470 L694 200 L900 200 L900 470 Z" fill="#F0F0EE"/><line x1="694" y1="230" x2="900" y2="230" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="694" y1="265" x2="900" y2="265" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="694" y1="300" x2="900" y2="300" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="694" y1="335" x2="900" y2="335" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="694" y1="370" x2="900" y2="370" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="694" y1="405" x2="900" y2="405" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><line x1="694" y1="440" x2="900" y2="440" stroke="#737E79" stroke-width="2" stroke-dasharray="5 4"/><text x="290" y="516" fill="#52696A" font-size="16" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">原始透视图</text><text x="800" y="516" fill="#52696A" font-size="16" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">IPM 后</text><text x="604" y="548" fill="#183235" font-size="15" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">H 为 3×3 单应矩阵；warp 用逆矩阵逐个目标像素取样。</text>
</svg>