<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">10｜Otsu：比较阈值候选的类间方差</title><desc id="desc">八个灰度样本分成暗亮两类，对照候选阈值和类间方差，显示并列阈值如何按扫描顺序取值。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">10｜Otsu：比较阈值候选的类间方差</text>
<rect x="42" y="94" width="494" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="564" y="94" width="494" height="486" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="68" y="137" fill="#167D72" font-size="21" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">同一组 8 个灰度样本</text><text x="590" y="137" fill="#167D72" font-size="21" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">逐个候选 T 比类间方差</text><line x1="102" y1="435" x2="492" y2="435" stroke="#52696A" stroke-width="2"/><rect x="124.58823529411765" y="385" width="16" height="50" rx="4" fill="#4D79A5" stroke="#4D79A5" stroke-width="1"/><rect x="127.64705882352942" y="385" width="16" height="50" rx="4" fill="#4D79A5" stroke="#4D79A5" stroke-width="1"/><rect x="139.88235294117646" y="385" width="16" height="50" rx="4" fill="#4D79A5" stroke="#4D79A5" stroke-width="1"/><rect x="146.0" y="385" width="16" height="50" rx="4" fill="#4D79A5" stroke="#4D79A5" stroke-width="1"/><rect x="399.88235294117646" y="385" width="16" height="50" rx="4" fill="#167D72" stroke="#167D72" stroke-width="1"/><rect x="415.1764705882353" y="385" width="16" height="50" rx="4" fill="#167D72" stroke="#167D72" stroke-width="1"/><rect x="427.4117647058824" y="385" width="16" height="50" rx="4" fill="#167D72" stroke="#167D72" stroke-width="1"/><rect x="430.47058823529414" y="385" width="16" height="50" rx="4" fill="#167D72" stroke="#167D72" stroke-width="1"/><line x1="149.41176470588235" y1="190" x2="149.41176470588235" y2="442" stroke="#ED7A3B" stroke-width="2" stroke-dasharray="6 4"/><line x1="155.52941176470588" y1="190" x2="155.52941176470588" y2="442" stroke="#D65B55" stroke-width="2" stroke-dasharray="2 3"/><line x1="256.47058823529414" y1="190" x2="256.47058823529414" y2="442" stroke="#52696A" stroke-width="2" stroke-dasharray="7 5"/><text x="102" y="468" fill="#52696A" font-size="14" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">0</text><text x="492" y="468" fill="#52696A" font-size="14" font-weight="500" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">255 灰度值</text><text x="90" y="510" fill="#4D79A5" font-size="16" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">20 22 30 34</text><text x="351" y="510" fill="#167D72" font-size="16" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">200 210 218 220</text><text x="92" y="552" fill="#ED7A3B" font-size="14" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">橙 T=31</text><text x="238" y="552" fill="#D65B55" font-size="14" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">红 T=35</text><text x="384" y="552" fill="#52696A" font-size="14" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">灰 T=101</text><text x="590" y="193" fill="#183235" font-size="14" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">T=31   n0=3 / n1=5   μ0=24 / μ1=176.4</text><text x="590" y="225" fill="#52696A" font-size="15" font-weight="600" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">Vbetween ≈ 5,443.54</text><rect x="585" y="266" width="438" height="88" rx="10" fill="#E5F1EB" stroke="#167D72" stroke-width="2"/><text x="604" y="298" fill="#183235" font-size="14" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">T=35   n0=4 / n1=4   μ0=26.5 / μ1=212</text><text x="604" y="332" fill="#167D72" font-size="16" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">Vbetween ≈ 8,602.56   ← 最大</text><text x="590" y="395" fill="#ED7A3B" font-size="14" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">T=101 分组相同，分数并列；实现保留最小 T=35。</text><text x="590" y="447" fill="#52696A" font-size="14" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">直方图单峰或阴影重叠时，大津仍会给数，</text><text x="590" y="475" fill="#52696A" font-size="14" font-weight="400" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">但这个数不保证对应道路边界。</text>
</svg>