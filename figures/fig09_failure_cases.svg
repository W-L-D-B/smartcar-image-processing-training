<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">09｜同一条处理链会遇到的失败输入</title><desc id="desc">四个原创合成示意帧分别展示正常边线、阴影、反光饱和和一侧断线加噪点。</desc>
<rect width="1100" height="650" rx="28" fill="#F5F3EC"/>
<text x="40" y="58" fill="#183235" font-size="30" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">09｜同一条处理链会遇到的失败输入</text>
<rect x="42" y="96" width="492" height="224" rx="14" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="1"/><text x="62" y="130" fill="#167D72" font-size="20" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">正常帧</text><text x="62" y="306" fill="#52696A" font-size="15" font-weight="500" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">两条边线均能看见</text><rect x="222" y="146" width="272" height="132" rx="8" fill="#DCE5DE" stroke="#D6DFD9" stroke-width="1"/><path d="M277 278 C298 242 316 208 337 146" fill="none" stroke="#183235" stroke-width="8"/><path d="M440 278 C419 242 401 208 381 146" fill="none" stroke="#183235" stroke-width="8"/><rect x="568" y="96" width="492" height="224" rx="14" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="1"/><text x="588" y="130" fill="#167D72" font-size="20" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">阴影</text><text x="588" y="306" fill="#52696A" font-size="15" font-weight="500" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">全局阈值可能误分</text><rect x="748" y="146" width="272" height="132" rx="8" fill="#DCE5DE" stroke="#D6DFD9" stroke-width="1"/><rect x="753" y="156" width="116" height="110" rx="0" fill="#52656A" stroke="none" stroke-width="1"/><path d="M803 278 C824 242 842 208 863 146" fill="none" stroke="#183235" stroke-width="8"/><path d="M966 278 C945 242 927 208 907 146" fill="none" stroke="#183235" stroke-width="8"/><line x1="750" y1="210" x2="1018" y2="210" stroke="#ED7A3B" stroke-width="2" stroke-dasharray="6 6"/><rect x="42" y="350" width="492" height="224" rx="14" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="1"/><text x="62" y="384" fill="#167D72" font-size="20" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">反光</text><text x="62" y="560" fill="#52696A" font-size="15" font-weight="500" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">局部饱和会丢边</text><rect x="222" y="400" width="272" height="132" rx="8" fill="#DCE5DE" stroke="#D6DFD9" stroke-width="1"/><rect x="366" y="400" width="128" height="132" rx="0" fill="#FFFBE7" stroke="none" stroke-width="1"/><path d="M277 532 C298 496 316 462 337 400" fill="none" stroke="#183235" stroke-width="8"/><path d="M440 532 C419 496 401 462 381 400" fill="none" stroke="#183235" stroke-width="8"/><line x1="224" y1="464" x2="492" y2="464" stroke="#ED7A3B" stroke-width="2" stroke-dasharray="6 6"/><rect x="568" y="350" width="492" height="224" rx="14" fill="#FFFFFF" stroke="#D6DFD9" stroke-width="1"/><text x="588" y="384" fill="#167D72" font-size="20" font-weight="700" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">单边断线 + 噪点</text><text x="588" y="560" fill="#52696A" font-size="15" font-weight="500" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">种子和连续性都重要</text><rect x="748" y="400" width="272" height="132" rx="8" fill="#DCE5DE" stroke="#D6DFD9" stroke-width="1"/><path d="M803 532 C824 496 842 462 863 400" fill="none" stroke="#183235" stroke-width="8" stroke-dasharray="16 13"/><path d="M966 532 C945 496 927 462 907 400" fill="none" stroke="#183235" stroke-width="8"/><circle cx="834" cy="490" r="3" fill="#D65B55" stroke="none" stroke-width="1"/><circle cx="878" cy="450" r="3" fill="#D65B55" stroke="none" stroke-width="1"/><circle cx="944" cy="501" r="3" fill="#D65B55" stroke="none" stroke-width="1"/><circle cx="976" cy="473" r="3" fill="#D65B55" stroke="none" stroke-width="1"/>
</svg>